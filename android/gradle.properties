# 8G heap plus 4G metaspace killed the daemon on a 16GB machine with an
# emulator running, which is an ordinary way to build and test this app.
# 3G is comfortably enough for a project this size.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
